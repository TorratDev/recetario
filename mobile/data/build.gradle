plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.recipeapp.data'
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':domain')
    implementation project(':network')
    
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.room:room-runtime:' + room_version
    implementation 'androidx.room:room-ktx:' + room_version

    kapt 'androidx.room:room-compiler:' + room_version

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.48'
    kapt 'com.google.dagger:hilt-compiler:2.48'

    // Paging
    implementation 'androidx.paging:paging-runtime-ktx:3.2.1'
    implementation 'androidx.paging:paging-compose:3.2.1'

    // Coroutines (repository implementations, suspend calls into network)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:' + coroutines_version

    // Encrypted local storage for the auth token
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Serializing the persisted session (network's Gson dependency is not
    // exposed transitively since it's declared `implementation` there)
    implementation 'com.google.code.gson:gson:' + gson_version

    testImplementation 'junit:junit:' + junit_version
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:' + coroutines_version
    // AuthRepositoryImplTest exercises HttpException/ResponseBody error mapping directly.
    testImplementation 'com.squareup.retrofit2:retrofit:' + retrofit_version
    testImplementation 'com.squareup.okhttp3:okhttp:' + okhttp_version
}