services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
      DB_PATH: /app/data/recipeapp.db
      UPLOAD_DIR: /app/uploads
      PORT: "8080"
    volumes:
      - recipeapp-db:/app/data
      - recipeapp-uploads:/app/uploads
    restart: unless-stopped

volumes:
  recipeapp-db:
  recipeapp-uploads:
